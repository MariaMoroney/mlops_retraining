name: CI model to dockerhub

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - staging

jobs:
  retraining_model:
    runs-on: ubuntu-latest
    container: docker://dvcorg/cml:latest
    env:
      repo_token: ${{ secrets.GITHUBTOKEN2 }}
    steps:
      - uses: actions/checkout@v2

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install requirements
        run:
          pip3 install -r requirements.txt

      #      - name: Download data
      #        run: python3 download_data.py
      #
      #      - name: Version the new data
      #        run: dvc add data/
      #
      #      - name: Push trained model to DVC
      #        run: dvc push data.dvc
      #        env:
      #          DVC_REMOTE: versioning

      - name: Execute the training model
        run: |
          python3 retraining.py

      - name: Generating report
        run: |
          echo "## Model metrics" > report.md
          cat metrics.txt >> report.md
          
          echo "## Data visualization" >> report.md
          cml-publish feature_importance.png --md >> report.md
          
          cml-send-comment report.md

      # Agregar este paso para guardar los archivos para el siguiente job
      - name: Save model files for Docker
        uses: actions/upload-artifact@v2
        with:
          name: model-artifacts
          path: |
            metrics.txt
            feature_importance.png
            # Agrega aquí cualquier otro archivo que necesites incluir
            # Por ejemplo: model.pkl
            # data/processed/*.csv

  build_docker_image:
    needs: retraining_model
    runs-on: ubuntu-latest

    steps:
      - name: Check the repo
        uses: actions/checkout@v2

      # Agregar este paso para obtener los archivos del job anterior
      - name: Download model artifacts
        uses: actions/download-artifact@v2
        with:
          name: model-artifacts
          path: ./

      - name: Login to dockerhub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build docker image
        run: docker build -t mariamoroney/mlops_retraining:mlops-retraining-dev .

      - name: Docker push to Dockerhub
        run: docker push mariamoroney/mlops_retraining:mlops-retraining-dev