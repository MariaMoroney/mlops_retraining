name: CI model to dockerhub

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - staging

jobs:
  retraining_model:
    # [Mantén este job igual]

  build_docker_image:
    needs: retraining_model
    runs-on: ubuntu-latest

    steps:
      - name: Check the repo
        uses: actions/checkout@v3

      - name: Login to dockerhub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build docker image
        run: docker build -t mariamoroney/mlops_retraining:mlops-retraining-dev .

      - name: Docker push to Dockerhub
        run: docker push mariamoroney/mlops_retraining:mlops-retraining-dev

      - name: Login into the server
        run: echo '${{ secrets.DOCKER_PASSWORD }}' | docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin

      - name: Prepare SSH key
        run: |
          mkdir -p ${{ github.workspace }}/ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ${{ github.workspace }}/ssh/private_key
          chmod 600 ${{ github.workspace }}/ssh/private_key
          ls -la ${{ github.workspace }}/ssh/

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key_path: ${{ github.workspace }}/ssh/private_key
          script: |
            docker login -u '${{ secrets.DOCKER_USERNAME }}' -p '${{ secrets.DOCKER_PASSWORD }}'
            if docker ps --all | grep breast-cancer; then
              docker stop breast-cancer
              docker rm breast-cancer
            fi
            
            docker pull ${{ secrets.DOCKER_USERNAME }}/mlops_retraining:mlops-retraining-dev
            docker run -d --name breast-cancer -p 8000:8000 ${{ secrets.DOCKER_USERNAME }}/mlops_retraining:mlops-retraining-dev